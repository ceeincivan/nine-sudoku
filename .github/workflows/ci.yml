name: CI/CD Pipeline

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Run Unit Tests
        run: npm run test

      - name: Build Web Application
        run: |
          npm run build
          mkdir -p dist
          cp -r .vercel/output/static/* dist/ 2>/dev/null || true
          if [ ! -f dist/index.html ]; then
            node -e '
              const fs = require("fs");
              const path = require("path");
              const assets = fs.readdirSync("dist/assets");
              const jsIndex = assets.find(f => f.startsWith("index-") && f.endsWith(".js"));
              const cssIndex = assets.find(f => f.startsWith("index-") && f.endsWith(".css"));
              const htmlContent = `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>NINE - Sudoku</title>
  ${cssIndex ? `<link rel="stylesheet" href="./assets/${cssIndex}" />` : ""}
</head>
<body class="min-h-screen bg-paper font-lexend text-ink antialiased selection:bg-ink selection:text-paper">
  <div id="root"></div>
  ${jsIndex ? `<script type="module" src="./assets/${jsIndex}"></script>` : ""}
</body>
</html>`;
              fs.writeFileSync("dist/index.html", htmlContent);
            '
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Place APK in Repository Folder
        run: |
          mkdir -p apk
          cp android/app/build/outputs/apk/debug/app-debug.apk apk/app-debug.apk

      - name: Commit and Push APK
        if: github.event_name == 'push'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f apk/app-debug.apk
          git diff --quiet && git diff --staged --quiet || (git commit -m "build: update Android APK" && git push origin HEAD:${{ github.ref_name }})
